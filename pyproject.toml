[project]
name = "bike-dashboard"
version = "0.1.0"
description = "Log all BLE data from a ThinkRider X2Max and show a live training dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "bleak>=0.22",
    "garmin-connect-personal-api-python>=1.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "fitdecode>=0.11.0",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["logger", "tests"]
addopts = "-q"
